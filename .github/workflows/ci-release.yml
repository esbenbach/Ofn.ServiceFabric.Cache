name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  DOTNET_VERSION: "10.x"
  BUILD_CONFIG: Release
  PROJECT_FILTER: "Ofn.ServiceFabric.Cache*.csproj"
  TEST_PROJECT_FILTER: "*.csproj"
  TEST_DIR: "test"

jobs:
  ci:
    name: Build, Test & Publish Preview
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $now = Get-Date -AsUTC
          $version = "$($now.Year).$($now.Month).$($now.Day).${{ github.run_number }}"
          echo "RELEASE_VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "PREVIEW_VERSION=$version-preview" >> $env:GITHUB_OUTPUT
          echo "Computed version: $version"

      - name: Restore
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter $env:PROJECT_FILTER | ForEach-Object {
            dotnet restore $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter $env:PROJECT_FILTER | ForEach-Object {
            dotnet build $_.FullName --configuration ${{ env.BUILD_CONFIG }} --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.PREVIEW_VERSION }}

      - name: Test
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Path $env:TEST_DIR -Filter $env:TEST_PROJECT_FILTER | ForEach-Object {
            dotnet test $_.FullName --configuration ${{ env.BUILD_CONFIG }} --no-build --no-restore --report-trx
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: "TestResults/**/*.trx"
          reporter: dotnet-trx

      - name: Pack (preview)
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "packages"
          Get-ChildItem -Recurse -Filter $env:PROJECT_FILTER | ForEach-Object {
            dotnet pack $_.FullName --configuration ${{ env.BUILD_CONFIG }} --no-build --no-restore --output $outputDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.PREVIEW_VERSION }}

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          $packagesDir = Join-Path $env:RUNNER_TEMP "packages"
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $packagesDir -Filter "*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName --source github --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER: 1

      - name: Upload packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-preview
          path: ${{ runner.temp }}/packages/*.nupkg
          retention-days: 30

    outputs:
      release_version: ${{ steps.version.outputs.RELEASE_VERSION }}
      preview_version: ${{ steps.version.outputs.PREVIEW_VERSION }}

  release:
    name: Publish to NuGet.org
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: NuGet-Release
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter $env:PROJECT_FILTER | ForEach-Object {
            dotnet restore $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter $env:PROJECT_FILTER | ForEach-Object {
            dotnet build $_.FullName --configuration ${{ env.BUILD_CONFIG }} --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          PACKAGE_VERSION: ${{ needs.ci.outputs.release_version }}

      - name: Pack (release)
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "packages"
          Get-ChildItem -Recurse -Filter $env:PROJECT_FILTER | ForEach-Object {
            dotnet pack $_.FullName --configuration ${{ env.BUILD_CONFIG }} --no-build --no-restore --output $outputDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          PACKAGE_VERSION: ${{ needs.ci.outputs.release_version }}

      - name: Authenticate with NuGet.org (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Esben

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          $packagesDir = Join-Path $env:RUNNER_TEMP "packages"
          Get-ChildItem $packagesDir -Filter "*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.ci.outputs.release_version }}
          name: v${{ needs.ci.outputs.release_version }}
          body: |
            ## Packages

            - `Ofn.ServiceFabric.Cache` v${{ needs.ci.outputs.release_version }}
            - `Ofn.ServiceFabric.Cache.Client` v${{ needs.ci.outputs.release_version }}
            - `Ofn.ServiceFabric.Cache.Abstractions` v${{ needs.ci.outputs.release_version }}

            Published to [NuGet.org](https://www.nuget.org/profiles/Esben).
          files: ${{ runner.temp }}/packages/*.nupkg
          generate_release_notes: true
